name: Bangun APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: npm install

      - name: Buat proyek Android
        run: npx cap add android

      - name: Buat ikon aplikasi
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0f7a5c' --iconBackgroundColorDark '#0f7a5c'

      - name: Sinkronkan isi www
        run: npx cap sync android

      - name: Bangun APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Terbitkan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK versi ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
